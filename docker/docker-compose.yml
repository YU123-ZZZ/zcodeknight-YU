# ZcodeKnight — Docker Compose.
#
# Run from THIS folder (docker/):
#
#   cd docker
#   docker compose up -d          build + start
#   docker compose logs -f        follow the engine log
#   docker compose down           stop (state stays here, in docker/)
#
# First run: open http://127.0.0.1:17800/admin, log in with the panel key from
# docker/config/config.yaml (default `admin`), then add accounts.
#
# ── 与网页版分开存放 ────────────────────────────────────────────────────────
# Everything this container writes lives beside this file — data/ and config/
# inside docker/. That one folder is the whole Docker deployment:
# archive, move or delete it as a unit.
#
# The local (non-Docker) web version keeps using the project's own ./data, so
# the two never share a store.
#
# That separation is not cosmetic. The account store is an encrypted file that
# each process reads into memory at startup and rewrites whole on every change
# (see account-store.ts: atomicWrite). Two engines pointed at one file do not
# merge: whichever writes last wins, and the other's account additions and
# deletions vanish silently. Running both against ./data would eventually lose
# accounts.
services:
  zcodeknight:
    build:
      # Context is THIS folder. Everything the image needs — src/, package.json,
      # bun.lock, logo.svg — is inside it, so this folder is a complete,
      # portable deployment: copy it to any machine with Docker and
      # `docker compose up -d` works.
      #
      # Those build inputs are GENERATED by server/scripts/prepare-docker.ts in
      # the project tree; re-run it after changing engine sources. Editing them
      # here is pointless — the next run overwrites them.
      context: .
      dockerfile: Dockerfile
    image: zcodeknight:latest
    container_name: zcodeknight
    restart: unless-stopped

    # Published on the HOST LOOPBACK only. The panel holds every account
    # credential, so exposing it to the network is a deliberate act: change this
    # to "17800:17800" if you actually want LAN access.
    #
    # Before you do, know what the key does and does not buy you: the engine
    # accepts `admin` as a built-in fallback key EVEN WHEN config.yaml sets a
    # real proxyApiKey (panel-session.ts:checkAdminKey, deliberate — it is the
    # way back in if the configured key is lost, and it has a test asserting it).
    # So "set a strong proxyApiKey" is NOT what protects a LAN-exposed panel;
    # only the loopback bind does. Keep the mapping as-is unless you accept that
    # anyone who can reach the port can try the documented default.
    ports:
      - "127.0.0.1:17800:17800"

    volumes:
      # Every path below is relative to THIS FILE's directory (docker/), so the
      # runtime state lands in docker/data and docker/config — one folder
      # holding the entire Docker deployment.
      #
      # These are NOT ../data: that belongs to the local web version, and two
      # engines on one encrypted store lose each other's writes (the store is
      # read whole and rewritten whole, so the last writer wins).
      #
      # Encrypted account store, probe results and update staging.
      # Losing this directory means re-logging-in every account.
      - ./data:/app/data
      # Configuration. This is a DIRECTORY mount, not a file mount: mounting a
      # file that does not exist yet makes Docker create a directory in its
      # place, and the engine would then fail to read it. A directory always
      # works, and the engine writes its template config into it on first run —
      # so `docker compose up` succeeds on a fresh clone with no manual step.
      #
      # The outbound proxy is configured here (proxy.enabled / proxy.url) or live
      # from the panel's Settings page, which writes back to this file.
      - ./config:/app/config

    environment:
      # The engine writes to /app/data by default; stated explicitly so the
      # intent survives a change to the default in paths.ts.
      ZCODE_KNIGHT_STORE_DIR: /app/data
      # Config lives on the mounted directory (see the volume comment above).
      ZCODE_PROXY_CONFIG: /app/config/config.yaml
      # Bind ALL interfaces inside the container.
      #
      # The engine now defaults to 127.0.0.1 (loopback), which is right for a
      # desktop install but wrong here: a container's published port is reached
      # through the container's own network interface, so a loopback-only bind
      # makes the mapping below unreachable. This does NOT widen exposure —
      # `ports:` still publishes on the host's loopback only.
      ZCODE_PROXY_HOST: "0.0.0.0"
      # Headless: no browser to open, no TTY to draw a UI into.
      CI: "1"
      # Optional outbound proxy for the engine's upstream calls. Set it if you
      # already have one; prefer proxy.url in config.yaml (or in the panel) so it
      # persists — these are only the fallback when config.yaml leaves it empty.
      #
      # It is NOT a proven fix for error 3012 ("unusual activity"). The reports
      # point at request SHAPE and client fingerprint rather than the source
      # address — one reporter had the official client, a shell and the web chat
      # all working while a container on the SAME machine failed 100%. See the
      # README's "Avoiding risk control" section before buying a proxy for this.
      # HTTPS_PROXY: "http://your-proxy:7890"
      # NO_PROXY: "localhost,127.0.0.1,::1"
      #
      # Model probing is OFF by default (probe.auto=false) and is now run by hand
      # from the panel. It is the most expensive thing the engine does unattended
      # - one request per model per account, so a sweep over 8 accounts is ~90
      # calls - and probing during a block is what extends it. Set this only if
      # you want the unattended sweep back and accept that trade.
      # ZCODE_PROBE_AUTO: "true"

    # The engine is single-process and light; these caps stop a runaway request
    # burst from taking the host down with it.
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
