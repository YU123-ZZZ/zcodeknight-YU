<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="0.35" stop-color="#b6c0cf"/>
      <stop offset="0.62" stop-color="#7c8798"/>
      <stop offset="1" stop-color="#4a5364"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2b4fb8" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#1c222c"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#vig)"/>
  <rect x="1.2" y="1.2" width="125.6" height="125.6" rx="25" fill="none" stroke="#2a2f38" stroke-width="1.6"/>

  <!-- knight helm: shield silhouette -->
  <path d="M64 14 L104 28 V62 C104 90 87 108 64 116 C41 108 24 90 24 62 V28 Z"
        fill="url(#metal)"/>
  <path d="M64 20 L98 32 V62 C98 86 83 102 64 109 C45 102 30 86 30 62 V32 Z"
        fill="#12161c"/>

  <!-- visor slit -->
  <rect x="38" y="46" width="52" height="7" rx="3.5" fill="#0b0d10"/>
  <rect x="38" y="46" width="52" height="2.4" rx="1.2" fill="url(#glow)" opacity="0.9"/>

  <!-- vertical helm ridge -->
  <path d="M64 22 V44" stroke="#8f9aab" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  <path d="M64 56 V106" stroke="#5b6472" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- breath holes -->
  <g fill="#0b0d10">
    <rect x="46" y="64" width="5" height="9" rx="2.5"/>
    <rect x="57.5" y="64" width="5" height="9" rx="2.5"/>
    <rect x="69" y="64" width="5" height="9" rx="2.5"/>
    <rect x="80.5" y="64" width="5" height="9" rx="2.5"/>
  </g>

  <!-- blade accents -->
  <path d="M30 34 L40 30 L38 42 Z" fill="#4f7cff" opacity="0.55"/>
  <path d="M98 34 L88 30 L90 42 Z" fill="#4f7cff" opacity="0.55"/>

  <!-- chevron crest -->
  <path d="M64 84 L74 92 L64 100 L54 92 Z" fill="url(#glow)" opacity="0.85"/>
</svg>
